<!-- data-theme="dark": the stream is a machine panel, dark in both OS themes
     (docs/DESIGN.md §2), and Belay is dark-first besides. -->
<html lang="en" data-theme="dark">
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src http: https: ws: wss:;" />
<title>Belay display</title>
<link rel="stylesheet" href="tokens.css" />
<link rel="stylesheet" href="display.css" />
<body>
  <canvas id="screen"></canvas>
  <div id="overlay">
    <span id="title"></span>
    <span id="keys"></span>
    <span id="stats"></span>
    <span id="controller" role="status"></span>
    <button id="gaming" class="boxed-toggle" type="button" aria-pressed="false">Gaming</button>
  </div>
  <script type="module" src="display.js"></script>
</body>
</html>
