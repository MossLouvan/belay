<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:; connect-src http: https: ws: wss:;" />
<title>Belay window</title>
<link rel="stylesheet" href="tokens.css" />
<link rel="stylesheet" href="seamless.css" />
<body>
  <canvas id="screen"></canvas>
  <div id="drag"></div>
  <div id="chrome">
    <button id="raise" title="Bring this window to the front on the host">↑</button>
    <button id="close" title="Close this local window (the remote window stays open)">×</button>
  </div>
  <div id="status"></div>
  <script type="module" src="seamless.js"></script>
</body>
