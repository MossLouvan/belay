[package]
name = "belay-wire"
version = "0.1.0"
edition = "2021"
description = "BWP — the Belay Wire Protocol: pure datagram protocol logic for low-latency remote desktop"
license = "MIT"

# The protocol core stays I/O-free: framing, arithmetic and control law, all
# exercisable under `cargo test` with no network and no hardware. The only
# dependencies are cryptographic primitives, and those are deliberately NOT
# hand-rolled — the protocol is custom, the crypto is not.
[dependencies]
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc", "getrandom"] }
hkdf = "0.12"
sha2 = "0.10"

[dev-dependencies]

[lib]
name = "belay_wire"
path = "src/lib.rs"
