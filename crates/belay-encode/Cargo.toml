[package]
name = "belay-encode"
version = "0.1.0"
edition = "2021"
description = "Screen capture and H.264 encoding for Belay — the path that replaces JPEG-per-frame"
license = "MIT"

[dependencies]
belay-wire = { path = "../belay-wire" }
# A persistent work-stealing pool. std::thread::scope spawns fresh threads on
# every call, which at 60fps is ~1000 thread creations a second purely as
# overhead - it capped speedup at 3x on 16 cores.
rayon = "1.10"

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Variant",
    "Win32_Media_MediaFoundation",
    "Win32_Media_KernelStreaming",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Gdi",
    "Win32_System_Performance",
]

[[bin]]
name = "encode-bench"
path = "src/bin/encode_bench.rs"

[[bin]]
name = "capture-bench"
path = "src/bin/capture_bench.rs"

[[bin]]
name = "gpu-bench"
path = "src/bin/gpu_bench.rs"

[[bin]]
name = "vp-probe"
path = "src/bin/vp_probe.rs"

