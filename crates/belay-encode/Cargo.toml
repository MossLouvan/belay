[package]
name = "belay-encode"
version = "0.1.0"
edition = "2021"
description = "Screen capture and H.264 encoding for Belay — the path that replaces JPEG-per-frame"
license = "MIT"

[dependencies]
belay-wire = { path = "../belay-wire" }

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Variant",
    "Win32_Media_MediaFoundation",
    "Win32_Media_KernelStreaming",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Gdi",
    "Win32_System_Performance",
]

[[bin]]
name = "encode-bench"
path = "src/bin/encode_bench.rs"
