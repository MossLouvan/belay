[package]
name = "belay-net-tunnel"
version = "0.1.0"
edition = "2021"
description = "The Belay tunnel: an iroh endpoint with ALPN belay/1, piping QUIC bi-streams to TCP"
license = "MIT"

[dependencies]
iroh = "1.3"
iroh-mdns-address-lookup = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
# A real relay in-process for tests/tunnel.rs, plain http like `iroh-relay --dev`.
iroh-relay = { version = "1.3", features = ["server"] }
