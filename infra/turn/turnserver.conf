# Belay TURN relay — coturn (https://github.com/coturn/coturn, BSD-3-Clause).
#
# ADOPTED, not built: coturn is the battle-tested reference TURN implementation
# (RFC 5766/8656) and implements the TURN REST API credential scheme natively,
# which is exactly what infra/rendezvous/src/turn-credentials.ts mints against.
#
# POLICY PARITY: max-bps / user-quota / total-quota below MUST match
# TURN_RELAY_POLICY in infra/rendezvous/src/turn-credentials.ts.
# infra/rendezvous/test/turn-credentials.test.ts parses this file and fails the
# build if they drift.
#
# UNVERIFIED-DEPLOY: this configuration is written to coturn's documented
# option set but has not been run against live cross-NAT traffic here. The
# verification runbook is in docs/SCALABILITY.md.

# ---- identity -------------------------------------------------------------
realm=turn.belay.example
# Set via env/secret manager at deploy time; NEVER commit a real value.
# static-auth-secret=${BELAY_TURN_SECRET}
use-auth-secret

# ---- listeners ------------------------------------------------------------
listening-port=3478
# TLS listener on 443 so UDP-blocked networks (corp/hotel) can still relay.
tls-listening-port=443
# cert=/etc/coturn/tls/fullchain.pem
# pkey=/etc/coturn/tls/privkey.pem
fingerprint

# ---- relay behaviour ------------------------------------------------------
# The relay carries DTLS-SRTP; it can never decrypt it. No TURN over plain TCP
# to peers; media stays UDP from the relay outward.
no-multicast-peers
no-cli
no-rfc5780
# STUN binding responses are cheap and useful for ICE; keep plain STUN on.

# Belay relays media between two user devices only. Deny relaying into
# loopback, link-local and RFC1918 space so a hostile client cannot use the
# relay to probe the PoP's own network (standard coturn hardening).
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# ---- caps (must match TURN_RELAY_POLICY) ----------------------------------
# Per-session relay bandwidth, bytes/second each direction.
max-bps=1500000
# Simultaneous allocations per username (one minted username = one session).
user-quota=4
# Simultaneous allocations across this PoP.
total-quota=1200

# ---- lifetimes ------------------------------------------------------------
# Allocations die soon after the short-lived credential does.
max-allocate-lifetime=3600
channel-lifetime=600
permission-lifetime=300

# ---- logging --------------------------------------------------------------
# No verbose packet logging in production: the relay must not become a
# metadata trove. Usernames in logs are already pseudonymous (mailbox-derived).
no-stdout-log
syslog
